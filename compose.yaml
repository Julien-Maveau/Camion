services:
  postgres:
    image: postgres:17-alpine
    container_name: camion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: camion
      POSTGRES_USER: camion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?La variable POSTGRES_PASSWORD doit être définie dans le fichier .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - camion-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camion -d camion"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  camion-postgres-data:
